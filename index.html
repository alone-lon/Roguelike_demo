<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端禁用缩放/滚动，保证游戏体验 -->

<!-- 防缓存三件套：避免手机浏览器/微信缓存旧版页面 -->

<style>
  /* ========== 全局样式：全屏画布 + 覆盖层UI ========== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1028; touch-action:none;

  /* 覆盖层通用 */

  .title { font-size:clamp(28px,7vw,64px); font-weight:900; letter-spacing:4px;

  /* 暂停按钮 */

  #shopClose { position:fixed; top:12px; top:calc(12px + env(safe-area-inset-top)); right:12px; z-index:30;
    width:46px; height:46px; border-radius:12px; border:2px solid rgba(255,255,255,0.35);
    background:rgba(60,30,80,0.9); color:#fff; font-size:18px; cursor:pointer; }
  #audioBtn { position:fixed; top:10px; top:calc(10px + env(safe-area-inset-top)); right:66px; z-index:16;

<body>

<!-- 游戏画布（画面全部由 Canvas 代码绘制） -->
<canvas id="game"></canvas>

<!-- 暂停按钮 + 静音开关 -->
<button id="audioBtn" title="静音开关">🔊</button>

<!-- 主菜单 -->
<div id="menu" class="overlay">

<script>
/* ============================================================
 * 《暗黑幸存者》v0.1 —— 单文件割草肉鸽（Canvas 2D 伪2.5D）
 * 架构说明：
 *   1) CONFIG/数据表：数值与进化公式全部走配置，扩展=加一行
 *   2) 输入层：键盘 + 移动端虚拟摇杆
 *   3) 实体层：玩家/敌人/子弹/宝石/掉落/粒子 全部对象池思维，数组管理
 *   4) 渲染层：drawSprite() 素材槽位预留，当前纯代码画Q版小人
 *   5) 流程层：菜单 → 战斗 → 升级5选1 → 结算 → 无尽
 * ============================================================ */

// ============================== 日志系统 ==============================
// 运行日志：环形缓冲存 localStorage，按 L 键导出 txt，方便排查线上问题
const LOG = {
  buf: [], max: 300, key: 'roguelike_demo_log_v1',
  push(level, msg) {
    const line = `[${new Date().toLocaleString('zh-CN')}] [${level}] ${msg}`;
    this.buf.push(line);
    if (this.buf.length > this.max) this.buf.shift(); // 环形缓冲，最多300条
    try { localStorage.setItem(this.key, this.buf.join('\n')); } catch (e) { /* 隐私模式忽略 */ }
  },
  info(msg) { this.push('INFO', msg); },
  warn(msg) { this.push('WARN', msg); },
  error(msg) { this.push('ERROR', msg); },
  // 导出日志文件（游戏中按 L 键触发）
  download() {
    const blob = new Blob([this.buf.join('\n') || '(日志为空)'], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'roguelike-game-log.txt';
    a.click();
    this.info('日志已导出');
  },
};
// 启动时恢复历史日志，并挂全局错误钩子（自动捕获报错）
try {
  const hist = localStorage.getItem(LOG.key);
  if (hist) LOG.buf = hist.split('\n').slice(-LOG.max);
} catch (e) { /* 忽略 */ }
window.addEventListener('error', e => LOG.error(`JS报错: ${e.message} @${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', e => LOG.error(`Promise报错: ${e.reason}`));
LOG.info('游戏脚本加载完成 v0.5');

// ============================== 音效系统（Web Audio 程序合成） ==============================
// 零资源文件：振荡器+噪声全合成，单HTML体积不涨。浏览器自动播放策略：必须在用户手势里 init()
const AudioSys = {
  ctx: null, master: null, muted: false, last: {}, bgmNext: 0, bgmStep: 0, timer: null,
  // 初始化音频上下文（在用户手势内调用，如开始游戏点击）
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      this.muted = save.settings.muted; // 恢复静音记忆
    }
    this.master.gain.value = this.muted ? 0 : 0.55;
    if (this.ctx.state === 'suspended') this.ctx.resume(); // 解除自动播放限制
  },
  // 基础合成音：振荡器 + 音量包络（slideTo 实现滑音）
  tone(freq, dur, type, vol, slideTo, when) {
    if (!this.ctx) return;
    const t = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  // 基础合成噪声：打击/爆破的质感来源
  noise(dur, vol, filterFreq, when) {
    if (!this.ctx) return;
    const t = when || this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  // 音效入口（带限频：怪海刷屏时高频音不糊成噪音）
  play(name) {
    if (!this.ctx || this.muted) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const now = performance.now();
    const minGap = { hit: 80, pop: 80, shoot: 100, coin: 60 }[name] || 0;
    if (this.last[name] && now - this.last[name] < minGap) return;
    this.last[name] = now;
    const T = this.ctx.currentTime;
    switch (name) {
      case 'shoot': this.tone(720, 0.06, 'square', 0.022, 420); break;
      case 'hit':   this.noise(0.05, 0.03, 1800); break;
      case 'pop':   this.tone(220, 0.09, 'triangle', 0.055, 90); break;
      case 'coin':  this.tone(1180, 0.06, 'square', 0.045); this.tone(1560, 0.09, 'square', 0.045, null, T + 0.06); break;
      case 'levelup': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.075, null, T + i * 0.09)); break;
      case 'evolve':
        [262, 330, 392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.5, 'sawtooth', 0.045, null, T + i * 0.07));
        this.noise(0.5, 0.07, 900);
        break;
      case 'hurt':  this.tone(170, 0.16, 'sawtooth', 0.1, 70); this.noise(0.12, 0.06, 700); break;
      case 'boss':  this.tone(110, 0.5, 'sawtooth', 0.11, 85); this.tone(110, 0.5, 'sawtooth', 0.11, 85, T + 0.55); break;
      case 'bomb':  this.noise(0.55, 0.14, 500); this.tone(90, 0.5, 'sine', 0.11, 40); break;
      case 'chest': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.065, null, T + i * 0.08)); break;
    }
  },
  // ---- BGM：合成器循环，三档紧张度随游戏时间切换 ----
  startBgm() {
    if (this.timer || !this.ctx) return;
    this.bgmNext = this.ctx.currentTime + 0.1;
    this.bgmStep = 0;
    this.timer = setInterval(() => this.scheduleBgm(), 120);
  },
  scheduleBgm() {
    if (!this.ctx) return;
    const T = this.ctx.currentTime;
    while (this.bgmNext < T + 0.35) {
      const step = this.bgmStep, t = this.bgmNext;
      const stage = game.time < 180 ? 0 : (game.time < 480 ? 1 : 2); // 热身/怪海/地狱
      const bassSeq = [110, 110, 130.8, 110, 98, 98, 130.8, 164.8]; // A小调低音律动
      if (!this.muted) {
        if (step % 2 === 0) this.tone(bassSeq[(step / 2) % 8], 0.22, 'triangle', 0.07, null, t);
        if (stage >= 1 && step % 2 === 1) this.noise(0.03, 0.018, 6000, t); // 怪海起：踩镲
        if (step % 8 === 0) [220, 261.6, 329.6].forEach(f => this.tone(f, 1.6, 'sine', 0.026, null, t)); // 铺底和弦
        if (stage >= 2 && step % 2 === 0) { // 地狱档：高音琶音加压
          const arp = [440, 523, 659, 784];
          this.tone(arp[(step / 2) % 4], 0.12, 'square', 0.016, null, t);
        }
      }
      this.bgmStep++;
      this.bgmNext += 0.216; // ≈139BPM 八分音符
    }
  },
  // 静音开关（记忆到存档）
  toggleMute() {
    this.muted = !this.muted;
    save.settings.muted = this.muted;
    writeSave();
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.55;
    return this.muted;
  },
};

// ============================== 基础设施 ==============================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1; // 画布逻辑尺寸与像素比

// 自适应窗口尺寸（电脑/移动端通用）
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); // 限制2倍，兼顾移动端性能
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============================== 数值配置 ==============================
const CONFIG = {
  playerHp: 100, playerSpeed: 190, playerR: 15, iframe: 0.6,      // 玩家基础
  weaponMax: 5, passiveMax: 5,                                     // 等级上限
  bossTime: 900, surviveTime: 960,                                 // 15分钟Boss / 16分钟存活通关
  enemyCap: 230,                                                   // 同屏怪物上限
  xpNeed: lv => Math.floor(5 + lv * 4 + lv * lv * 0.8),            // 升级经验曲线
};

// 局外永久属性表（金币商店，加属性=加一行）
const META_DEFS = {
  dmg:       { name:'攻击伤害', icon:'⚔', desc:'全局伤害 +5%/级', max:8, baseCost:50 },
  hp:        { name:'生命上限', icon:'❤', desc:'初始生命 +15/级', max:8, baseCost:50 },
  moveSpeed: { name:'移动速度', icon:'👟', desc:'移动速度 +3%/级', max:8, baseCost:60 },
  pickup:    { name:'拾取范围', icon:'🧲', desc:'拾取范围 +10%/级', max:8, baseCost:40 },
  cdr:       { name:'冷却缩减', icon:'⏱', desc:'武器冷却 -2%/级', max:8, baseCost:80 },
  xpBonus:   { name:'经验加成', icon:'✨', desc:'获得经验 +8%/级', max:8, baseCost:60 },
};
// 商店费用递增曲线：每级费用 = 基础费 × 1.7^当前级
const metaCost = (id, lv) => Math.floor(META_DEFS[id].baseCost * Math.pow(1.7, lv));

// 武器配置表（首发：暗黑系 + 圣骑系）
const WEAPON_DEFS = {
  arrow:    { name:'暗影箭',   icon:'🏹', desc:'自动射向最近的敌人' },
  scythe:   { name:'噬魂血镰', icon:'镰', desc:'血镰环绕自身旋转' },
  poison:   { name:'瘟疫毒环', icon:'☠', desc:'脚下扩散瘟疫毒圈' },
  hammer:   { name:'审判之锤', icon:'🔨', desc:'掷出回旋圣锤' },
  skeleton: { name:'骷髅召唤', icon:'💀', desc:'召唤小骷髅追击敌人' },
  sword:    { name:'裁决飞剑', icon:'🗡', desc:'贯穿飞剑穿透敌阵' },
  storm:    { name:'神圣风暴', icon:'⚡', desc:'闪电链打击周围敌人' },
  holyfire: { name:'奉献圣火', icon:'🔥', desc:'脚下留下圣火区域' },
};

// 被动配置表（8项，兼做进化材料）
const PASSIVE_DEFS = {
  dmg:       { name:'攻击伤害', icon:'⚔', desc:'伤害 +12%' },
  atkSpeed:  { name:'攻击速度', icon:'⚡', desc:'攻速 +10%' },
  area:      { name:'攻击范围', icon:'🌀', desc:'范围 +12%' },
  cdr:       { name:'冷却缩减', icon:'⏱', desc:'冷却 -8%' },
  hp:        { name:'生命上限', icon:'❤', desc:'生命 +25' },
  moveSpeed: { name:'移动速度', icon:'👟', desc:'移速 +8%' },
  projSpeed: { name:'投射速度', icon:'💨', desc:'弹速 +12%' },
  pickup:    { name:'拾取范围', icon:'🧲', desc:'拾取 +30%' },
};

// 进化公式配置表 —— 预留扩展位：加新进化公式只需加一行
const EVOLUTIONS = [
  { weapon:'arrow',  passive:'atkSpeed', name:'暗影箭雨', icon:'🌠', desc:'箭矢化作漫天箭雨' },
  { weapon:'scythe', passive:'hp',       name:'亡者血镰', icon:'💀', desc:'血镰吸血并扩大范围' },
  { weapon:'poison', passive:'area',     name:'亡疫领域', icon:'🟢', desc:'毒雾扩散并减速敌人' },
  { weapon:'hammer',   passive:'dmg',      name:'圣光巨锤', icon:'☀', desc:'巨锤落地引发冲击波' },
  { weapon:'skeleton', passive:'cdr',      name:'骷髅军团', icon:'☠', desc:'骷髅数量翻倍强化' },

// 移动端虚拟摇杆（全屏任意位置按下即出摇杆：按下处即摇杆中心，哪里按哪里走）
const joy = { active: false, id: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
// 摇杆强制重置：界面切换时调用，防止上一次触摸状态残留导致"摇杆失灵"
function joyReset() { joy.active = false; joy.id = null; joy.dx = joy.dy = 0; }
// 判断触摸点是否落在 UI 元素上（按钮/卡片等），UI 触摸要留给点击事件，不能被摇杆抢走
function isUITouch(t) {
  const el = document.elementFromPoint(t.clientX, t.clientY);
  return !!(el && el.closest && el.closest('button, .card'));
}
// 监听挂 window 而不是 canvas：覆盖整屏（含边缘区域），修复"只有屏幕中间能按出摇杆"
window.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    // 只在游戏进行中 + 非UI区域 + 摇杆空闲时激活，全屏皆可按
    if (!joy.active && game.state === 'playing' && !isUITouch(t)) {
      joy.active = true; joy.id = t.identifier;
      joy.baseX = t.clientX; joy.baseY = t.clientY; joy.dx = joy.dy = 0;
      e.preventDefault();
    }
  }
}, { passive: false });
window.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      // 摇杆向量，最大半径60px
      const dx = t.clientX - joy.baseX, dy = t.clientY - joy.baseY;
      const d = Math.hypot(dx, dy) || 1, cap = Math.min(d, 60);
      joy.dx = dx / d * cap; joy.dy = dy / d * cap;
      e.preventDefault();
    }
  }
}, { passive: false });
function joyEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) joyReset();
  }
}
window.addEventListener('touchend', joyEnd);
window.addEventListener('touchcancel', joyEnd);

// ============================== 工具函数 ==============================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };

// 屏幕震动（爽感全家桶之一）

}
// 粒子
function addParticles(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.3, 1) * (speed || 130);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(0.3, 0.7), size: rand(2, 5), color });

}

// ============================== 渲染层：Q版小人绘制（素材槽位） ==============================
// 【素材槽位】后续换皮：把 drawSprite 内部换成 drawImage(预加载贴图) 即可，架构不动
function drawSprite(x, y, scale, bodyColor, headColor, opts) {
  opts = opts || {};
  // 脚下阴影（2.5D立体感来源之一）
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(x, y, 13 * scale, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();
  // 身体
  ctx.fillStyle = bodyColor;
  roundRect(x - 9 * scale, y - 20 * scale, 18 * scale, 17 * scale, 7 * scale); ctx.fill();
  // 头
  ctx.fillStyle = headColor;
  ctx.beginPath(); ctx.arc(x, y - 28 * scale, 11 * scale, 0, Math.PI * 2); ctx.fill();
  // 眼睛（Q版灵魂）
  ctx.fillStyle = '#222';
  const eo = (opts.facing || 1) * 3 * scale;
  ctx.beginPath(); ctx.arc(x + eo - 3.5 * scale, y - 29 * scale, 1.9 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + eo + 3.5 * scale, y - 29 * scale, 1.9 * scale, 0, Math.PI * 2); ctx.fill();
  // 腮红
  ctx.fillStyle = 'rgba(255,120,140,0.45)';
  ctx.beginPath(); ctx.arc(x + eo - 7 * scale, y - 25 * scale, 2.4 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + eo + 7 * scale, y - 25 * scale, 2.4 * scale, 0, Math.PI * 2); ctx.fill();
  // 角/装饰
  if (opts.horns) {
    ctx.fillStyle = opts.hornColor || '#e8e0ff';
    ctx.beginPath(); ctx.moveTo(x - 9 * scale, y - 36 * scale); ctx.lineTo(x - 4 * scale, y - 32 * scale);
    ctx.lineTo(x - 11 * scale, y - 30 * scale); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 9 * scale, y - 36 * scale); ctx.lineTo(x + 4 * scale, y - 32 * scale);
    ctx.lineTo(x + 11 * scale, y - 30 * scale); ctx.closePath(); ctx.fill();
  }
}
// 圆角矩形辅助
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 2.5D等距地面：预渲染一张网格砖块贴图，滚动平铺（性能友好）
const groundTile = document.createElement('canvas');
groundTile.width = 128; groundTile.height = 64;
(function renderGroundTile() {
  const g = groundTile.getContext('2d');
  g.fillStyle = '#241640'; g.fillRect(0, 0, 128, 64);
  // 等距菱形网格
  g.strokeStyle = 'rgba(140,110,220,0.22)'; g.lineWidth = 1.5;
  const diamond = (cx, cy) => {
    g.beginPath(); g.moveTo(cx, cy - 16); g.lineTo(cx + 32, cy); g.lineTo(cx, cy + 16); g.lineTo(cx - 32, cy); g.closePath(); g.stroke();
  };
  diamond(32, 16); diamond(96, 16); diamond(32, 48); diamond(96, 48); diamond(64, 32); diamond(0, 32); diamond(128, 32);
  // 地面装饰点缀
  g.fillStyle = 'rgba(160,120,255,0.12)';
  for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(Math.random() * 128, Math.random() * 64, 2, 0, Math.PI * 2); g.fill(); }
})();

// ============================== 玩家属性计算 ==============================
function recomputeStats() {
  const p = player.passives, m = save.meta; // 局内被动 + 局外永久属性双层叠加
  player.dmgMult = (1 + 0.12 * (p.dmg || 0)) * (1 + 0.05 * (m.dmg || 0));
  player.atkSpeedMult = 1 + 0.10 * (p.atkSpeed || 0);
  player.areaMult = 1 + 0.12 * (p.area || 0);
  player.cdMult = Math.max(0.35, 1 - 0.08 * (p.cdr || 0) - 0.02 * (m.cdr || 0));
  player.projSpeedMult = 1 + 0.12 * (p.projSpeed || 0);
  player.speed = CONFIG.playerSpeed * (1 + 0.08 * (p.moveSpeed || 0)) * (1 + 0.03 * (m.moveSpeed || 0));
  player.pickup = 110 * (1 + 0.30 * (p.pickup || 0)) * (1 + 0.10 * (m.pickup || 0));
  const newMax = CONFIG.playerHp + 25 * (p.hp || 0) + 15 * (m.hp || 0);
  if (newMax > player.maxHp) player.hp += newMax - player.maxHp; // 加上限时补差值
  player.maxHp = newMax;
}

// ============================== 敌人生成与难度曲线 ==============================
// 血量双成长：线性 + 每3分钟阶梯抬升（压迫感）
function hpMult() { return (1 + game.time / 90) * (1 + Math.floor(game.time / 180) * 0.5); }
function dmgMult() { return 1 + Math.floor(game.time / 180) * 0.25; }

const ENEMY_TYPES = {
  normal: { hp: 10, speed: 56, dmg: 8,  r: 14, xp: 1, body: '#6c4bd8', head: '#a78bfa', scale: 1.0 },
  fast:   { hp: 7,  speed: 112, dmg: 6, r: 11, xp: 1, body: '#e8843c', head: '#ffc07a', scale: 0.85 },
  ranged: { hp: 13, speed: 46, dmg: 10, r: 14, xp: 2, body: '#2fa8a0', head: '#7fe6dd', scale: 1.0 },
  elite:  { hp: 70, speed: 72, dmg: 18, r: 25, xp: 8, body: '#c2304e', head: '#ff7d92', scale: 1.7, horns: true },
  gold:   { hp: 30, speed: 128, dmg: 4, r: 13, xp: 5, body: '#e8b93c', head: '#ffe98a', scale: 1.0 },
  boss:   { hp: 3500, speed: 42, dmg: 30, r: 48, xp: 60, body: '#7a1030', head: '#e8506a', scale: 3.0, horns: true },
};

function spawnEnemy(type, x, y) {
  const d = ENEMY_TYPES[type];
  if (x === undefined) {
    // 在镜头外随机一圈生成
    const a = rand(0, Math.PI * 2), R = Math.hypot(W, H) / 2 + 70;
    x = player.x + Math.cos(a) * R; y = player.y + Math.sin(a) * R;
  }
  const hm = hpMult();
  enemies.push({
    type, x, y, r: d.r * (type === 'boss' ? 1 : 1), hp: d.hp * hm * (type === 'boss' ? 1 : 1),
    maxHp: d.hp * hm, speed: d.speed * (type === 'gold' ? 1 : 1) * rand(0.92, 1.08),
    dmg: d.dmg * dmgMult(), xp: d.xp, scale: d.scale, body: d.body, head: d.head, horns: d.horns,
    shootCd: rand(1, 2.5), hitT: { scythe: 0, poison: 0 }, slowT: 0, flash: 0,
    // Boss专用
    burstCd: 3, dead: false,
  });
  if (type === 'boss') game.boss = enemies[enemies.length - 1];
}

// 刷怪调度：密度随时间提升，每3分钟小台阶
let spawnBudget = 0, specialCd = { elite: 30, gold: 45 };
function updateSpawner(dt) {
  const t = game.time;
  const step = 1 + Math.floor(t / 180) * 0.25;            // 阶梯：每3分钟刷怪+25%
  const rate = (1.4 + t * 0.055) * step;                   // 线性增长的每秒刷怪量
  spawnBudget += rate * dt;
  while (spawnBudget >= 1 && enemies.length < CONFIG.enemyCap) {
    spawnBudget -= 1;
    // 怪物构成随时间解锁
    const roll = Math.random();
    let type = 'normal';
    if (t > 30 && roll < 0.28) type = 'fast';
    if (t > 90 && roll > 0.82) type = 'ranged';
    spawnEnemy(type);
  }
  // 精英/金怪定时登场
  specialCd.elite -= dt;
  if (specialCd.elite <= 0) { specialCd.elite = Math.max(18, 48 - t / 30); spawnEnemy('elite'); }
  specialCd.gold -= dt;
  if (specialCd.gold <= 0) { specialCd.gold = rand(40, 70); spawnEnemy('gold'); }

  // 15分钟Boss压场
  if (!game.bossSpawned && t >= CONFIG.bossTime) {
    game.bossSpawned = true;
    spawnEnemy('boss');
    game.flashT = 1.2; shake(18, 0.8); // 红屏警告
    AudioSys.play('boss');
    addDmgText(player.x, player.y - 60, '最终BOSS 降临！', '#ff5566', 26);
  }
  // 16分钟仍未击杀Boss也算存活通关
  if (!game.endless && game.bossSpawned && t >= CONFIG.surviveTime && game.boss && game.boss.hp > 0) {
    victory();
  }
}

// ============================== 武器系统 ==============================
function giveWeapon(id) {
  if (player.weapons[id]) return;
  player.weapons[id] = { level: 1, evolved: false, cd: 0, t: 0, hx: 0, hy: 0, hammerOut: false };
}
function weaponDmg(base, lv) { return (base + lv * 5) * player.dmgMult; }

function updateWeapons(dt) {
  for (const id in player.weapons) {
    const w = player.weapons[id], lv = w.level;
    w.t += dt; w.cd -= dt;

    // ---- 暗影箭：自动射向最近敌人（进化：暗影箭雨）----
    if (id === 'arrow') {
      const interval = 1.2 * player.cdMult / player.atkSpeedMult;
      if (w.cd <= 0) {
        const target = nearestEnemy();
        if (target) {
          w.cd = interval;
          AudioSys.play('shoot');
          let count = 1 + (lv >= 3 ? 1 : 0) + (lv >= 5 ? 1 : 0);
          let spread = 0.18, pierce = 0;
          if (w.evolved) { count += 3; spread = 0.28; pierce = 1; } // 进化：暗影箭雨
          const base = Math.atan2(target.y - player.y, target.x - player.x);
          for (let i = 0; i < count; i++) {
            const a = base + (i - (count - 1) / 2) * spread;
            bullets.push({
              x: player.x, y: player.y - 12, vx: Math.cos(a) * 430 * player.projSpeedMult,
              vy: Math.sin(a) * 430 * player.projSpeedMult, dmg: weaponDmg(12, lv) * (w.evolved ? 1.25 : 1),
              r: 7, life: 1.6, pierce, type: 'arrow',
            });
          }
        }
      }
    }

    // ---- 噬魂血镰：环绕旋转（进化：亡者血镰 吸血+大范围）----
    if (id === 'scythe') {
      let n = 1 + Math.floor(lv / 2) + (w.evolved ? 2 : 0);
      const orbitR = (72 + lv * 4) * player.areaMult * (w.evolved ? 1.35 : 1);
      for (let i = 0; i < n; i++) {
        const a = w.t * 2.4 + i * Math.PI * 2 / n;
        const sx = player.x + Math.cos(a) * orbitR, sy = player.y + Math.sin(a) * orbitR * 0.7; // 压扁成椭圆更像2.5D
        for (const e of enemies) {
          if (e.dead || e.hitT.scythe > 0) continue;
          const er = e.r + 14;
          if ((e.x - sx) ** 2 + (e.y - sy) ** 2 < er * er) {
            e.hitT.scythe = 0.45;
            damageEnemy(e, weaponDmg(10, lv) * (w.evolved ? 1.4 : 1));
            if (w.evolved) player.hp = Math.min(player.maxHp, player.hp + 2); // 进化吸血
          }
        }
      }
    }

    // ---- 瘟疫毒环：脚下持续毒圈（进化：亡疫领域 减速+大范围）----
    if (id === 'poison') {
      const rad = (62 + lv * 9) * player.areaMult * (w.evolved ? 1.5 : 1);
      w.poisonR = rad;
      if (w.cd <= 0) {
        w.cd = 0.5;
        for (const e of enemies) {
          if (e.dead || e.hitT.poison > 0) continue;
          if (dist2(e, player) < (rad + e.r) ** 2) {
            e.hitT.poison = 0.5;
            damageEnemy(e, weaponDmg(3, lv) * 0.6);
            if (w.evolved) e.slowT = 1.2; // 进化减速
          }
        }
      }
    }

    // ---- 审判之锤：回旋投掷（进化：圣光巨锤 冲击波）----
    if (id === 'hammer') {
      const interval = 2.4 * player.cdMult / player.atkSpeedMult;
      if (w.cd <= 0 && !w.hammerOut) {
        w.cd = interval; w.hammerOut = true; w.ht = 0;
        const target = nearestEnemy();
        const a = target ? Math.atan2(target.y - player.y, target.x - player.x) : (player.facing > 0 ? 0 : Math.PI);
        w.hdirX = Math.cos(a); w.hdirY = Math.sin(a);
        w.hx = player.x; w.hy = player.y;
      }
      if (w.hammerOut) {
        w.ht += dt;
        const dur = 1.2, half = dur / 2;
        if (w.ht < half) { // 飞出
          w.hx += w.hdirX * 360 * dt; w.hy += w.hdirY * 360 * dt;
        } else {           // 飞回玩家
          const dx = player.x - w.hx, dy = player.y - w.hy, d = Math.hypot(dx, dy) || 1;
          w.hx += dx / d * 430 * dt; w.hy += dy / d * 430 * dt;
          if (d < 20) {
            w.hammerOut = false;
            if (w.evolved) { // 进化：落地冲击波
              shake(10, 0.35);
              addParticles(player.x, player.y, '#ffd77a', 22, 220);
              for (const e of enemies) {
                if (!e.dead && dist2(e, player) < (100 * player.areaMult + e.r) ** 2) damageEnemy(e, weaponDmg(25, lv) * 1.6);
              }
            }
          }
        }
        // 锤子碰撞
        if (w.hammerOut) {
          for (const e of enemies) {
            if (e.dead || e.hitT.hammer > 0) continue;
            const er = e.r + 18;
            if ((e.x - w.hx) ** 2 + (e.y - w.hy) ** 2 < er * er) {
              e.hitT.hammer = 0.35;
              damageEnemy(e, weaponDmg(20, lv) * (w.evolved ? 1.4 : 1));
            }
          }
        }
      }
    }

    // ---- 骷髅召唤：召唤小骷髅追击敌人（进化：骷髅军团 数量翻倍）----
    if (id === 'skeleton') {
      const interval = 3.2 * player.cdMult / player.atkSpeedMult;
      if (w.cd <= 0) {
        w.cd = interval;
        const n = 1 + Math.floor(lv / 2) + (w.evolved ? 2 : 0);
        for (let i = 0; i < n; i++) {
          const a = rand(0, Math.PI * 2);
          minions.push({
            x: player.x + Math.cos(a) * 30, y: player.y + Math.sin(a) * 30,
            vx: Math.cos(a) * 60, vy: Math.sin(a) * 60,
            dmg: weaponDmg(8, lv) * (w.evolved ? 1.3 : 1), life: 5, r: 12,
          });
        }
      }
    }

    // ---- 裁决飞剑：贯穿飞剑（进化：万剑归宗 剑阵齐发）----
    if (id === 'sword') {
      const interval = 1.5 * player.cdMult / player.atkSpeedMult;
      if (w.cd <= 0) {
        w.cd = interval;
        let count = 1 + (lv >= 3 ? 1 : 0) + (lv >= 5 ? 1 : 0);
        let spread = 0.14, pierce = 3;
        if (w.evolved) { count += 3; spread = 0.2; pierce = 99; } // 进化：无限穿透剑阵
        const target = nearestEnemy();
        const base = target ? Math.atan2(target.y - player.y, target.x - player.x) : (player.facing > 0 ? 0 : Math.PI);
        for (let i = 0; i < count; i++) {
          const a = base + (i - (count - 1) / 2) * spread;
          bullets.push({
            x: player.x, y: player.y - 12, vx: Math.cos(a) * 520 * player.projSpeedMult,
            vy: Math.sin(a) * 520 * player.projSpeedMult, dmg: weaponDmg(16, lv) * (w.evolved ? 1.25 : 1),
            r: 9, life: 1.2, pierce, type: 'sword',
          });
        }
      }
    }

    // ---- 神圣风暴：闪电链打击最近敌人（进化：天罚风暴 范围数量大增）----
    if (id === 'storm') {
      const interval = 2.2 * player.cdMult / player.atkSpeedMult;
      if (w.cd <= 0) {
        w.cd = interval;
        const range = 320 * player.areaMult * (w.evolved ? 1.5 : 1);
        const targets = 2 + lv + (w.evolved ? 5 : 0);
        // 范围内最近的N个敌人挨雷劈
        const inRange = enemies.filter(e => !e.dead && dist2(e, player) < range * range)
          .sort((a, b) => dist2(a, player) - dist2(b, player)).slice(0, targets);
        for (const e of inRange) {
          zaps.push({ x1: player.x, y1: player.y - 30, x2: e.x, y2: e.y - e.r, life: 0.18 });
          damageEnemy(e, weaponDmg(9, lv) * (w.evolved ? 1.4 : 1));
        }
      }
    }

    // ---- 奉献圣火：脚下留下圣火区域（进化：炼狱圣域 火大持久）----
    if (id === 'holyfire') {
      const interval = 3.0 * player.cdMult / player.atkSpeedMult;
      if (w.cd <= 0) {
        w.cd = interval;
        fireZones.push({
          x: player.x, y: player.y,
          r: (70 + lv * 6) * player.areaMult * (w.evolved ? 1.4 : 1),
          life: w.evolved ? 7 : 5, tickCd: 0,
          dmg: weaponDmg(3, lv) * 0.6 * (w.evolved ? 1.5 : 1),
        });
      }
    }
  }
}

// 找最近敌人（武器索敌用）
function nearestEnemy() {
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = dist2(e, player);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

// 召唤物与地面区域更新：骷髅追敌、圣火灼烧、闪电特效衰减
function updateSummons(dt) {
  // 小骷髅：转向插值追踪最近敌人，接触伤害，寿命耗尽消散
  for (let i = minions.length - 1; i >= 0; i--) {
    const m = minions[i];
    m.life -= dt;
    if (m.life <= 0) { minions.splice(i, 1); continue; }
    const target = nearestEnemy();
    if (target) {
      const dx = target.x - m.x, dy = target.y - m.y, d = Math.hypot(dx, dy) || 1;
      // 转向插值（走弧线，比直冲更像活物）
      m.vx += (dx / d * 220 - m.vx) * Math.min(1, dt * 5);
      m.vy += (dy / d * 220 - m.vy) * Math.min(1, dt * 5);
    }
    m.x += m.vx * dt; m.y += m.vy * dt;
    for (const e of enemies) {
      if (e.dead || e.hitT.minion > 0) continue;
      const er = e.r + m.r;
      if ((e.x - m.x) ** 2 + (e.y - m.y) ** 2 < er * er) {
        e.hitT.minion = 0.35;
        damageEnemy(e, m.dmg);
      }
    }
  }
  // 圣火区域：0.5秒一跳灼烧区域内全部敌人
  for (let i = fireZones.length - 1; i >= 0; i--) {
    const z = fireZones[i];
    z.life -= dt;
    if (z.life <= 0) { fireZones.splice(i, 1); continue; }
    z.tickCd -= dt;
    if (z.tickCd <= 0) {
      z.tickCd = 0.5;
      for (const e of enemies) {
        if (!e.dead && dist2(e, z) < (z.r + e.r) ** 2) damageEnemy(e, z.dmg);
      }
    }
  }
  // 闪电特效衰减
  for (let i = zaps.length - 1; i >= 0; i--) {
    zaps[i].life -= dt;
    if (zaps[i].life <= 0) zaps.splice(i, 1);
  }
}

// ============================== 伤害与击杀 ==============================
function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.12;
  if (Math.random() < 0.5) addParticles(e.x, e.y - e.r, '#fff', 2, 90); // 命中火花（概率触发省性能）
  AudioSys.play('hit');
  game.damage += dmg;
  addDmgText(e.x, e.y - e.r * 1.6, Math.round(dmg), dmg > 40 ? '#ffd77a' : '#fff', dmg > 40 ? 20 : 15);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  game.kills++;
  // 连杀系统：持续击杀累积连杀数，屏幕中央跳大字
  game.combo++; game.comboT = 2.5; game.comboScale = 1;
  AudioSys.play('pop');
  addParticles(e.x, e.y - 10, e.head, e.type === 'boss' ? 60 : 10, e.type === 'boss' ? 320 : 150);
  if (e.type === 'boss') {
    shake(20, 1); game.flashT = 0.8;
    victory();
    return;
  }
  // 经验宝石（大怪掉大宝石）
  const gemSize = e.xp >= 8 ? 'big' : 'small';
  gems.push({ x: e.x, y: e.y, vx: rand(-40, 40), vy: rand(-40, 40), value: e.xp, big: gemSize === 'big' });
  // 特殊掉落
  const r = Math.random();
  if (e.type === 'gold') {
    // 金币雨演出：金色粒子炸开 + 大字提示 + 8枚金币四散
    addParticles(e.x, e.y - 10, '#ffd77a', 20, 240);
    addDmgText(e.x, e.y - 40, '金币雨！', '#ffd77a', 22);
    for (let i = 0; i < 8; i++) drops.push({ type: 'coin', x: e.x + rand(-25, 25), y: e.y + rand(-25, 25), t: 0 });
  }
  else if (e.type === 'elite') { drops.push({ type: r < 0.5 ? 'chest' : 'magnet', x: e.x, y: e.y, t: 0 }); }
  else if (r < 0.012) drops.push({ type: 'chicken', x: e.x, y: e.y, t: 0 });
  else if (r < 0.02) drops.push({ type: 'bomb', x: e.x, y: e.y, t: 0 });
}

function damagePlayer(dmg) {
  if (player.iframe > 0 || game.state !== 'playing') return;
  player.hp -= dmg;
  player.iframe = CONFIG.iframe;
  AudioSys.play('hurt');
  shake(9, 0.3);
  addDmgText(player.x, player.y - 40, '-' + Math.round(dmg), '#ff6b6b', 20);
  game.flashT = Math.max(game.flashT, 0.25);
  if (player.hp <= 0) { player.hp = 0; gameOver(); }
}

// ============================== 经验与升级 ==============================
function addXp(v) {
  v = Math.round(v * (1 + 0.08 * (save.meta.xpBonus || 0))); // 局外经验加成
  game.xp += v;
  while (game.xp >= game.xpNeed) {
    game.xp -= game.xpNeed;
    game.level++;
    game.xpNeed = CONFIG.xpNeed(game.level);
    game.pendingLevels++; // 连升排队：保证每级都给一次5选1（修复连升只弹一次的bug）
  }
  if (game.pendingLevels > 0 && game.state === 'playing') openLevelUp();
}

// 生成升级5选1选项（进化选项优先置顶）
function generateOptions() {
  const evos = [], others = [];
  // 进化：武器满级 + 拥有配对被动
  for (const ev of EVOLUTIONS) {
    const w = player.weapons[ev.weapon];
    if (w && w.level >= CONFIG.weaponMax && !w.evolved && player.passives[ev.passive]) {
      evos.push({ type: 'evolution', ev, tag: '超武进化' });
    }
  }
  // 新武器（全部武器都可进池）
  if (Object.keys(player.weapons).length < Object.keys(WEAPON_DEFS).length) {
    for (const id in WEAPON_DEFS) if (!player.weapons[id]) others.push({ type: 'newWeapon', id, tag: '新武器' });
  }
  // 武器升级
  for (const id in player.weapons) {
    const w = player.weapons[id];
    if (w.level < CONFIG.weaponMax && !w.evolved) others.push({ type: 'weaponUp', id, tag: '武器 Lv' + (w.level + 1) });
  }
  // 被动（新的/升级的）
  for (const id in PASSIVE_DEFS) {
    const lv = player.passives[id] || 0;
    if (lv < CONFIG.passiveMax) others.push({ type: lv === 0 ? 'newPassive' : 'passiveUp', id, tag: lv === 0 ? '新被动' : '被动 Lv' + (lv + 1) });
  }
  // 通用回血选项
  others.push({ type: 'heal', tag: '回复' });
  // 打乱顺序后，进化选项固定排最前
  for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
  return evos.concat(others).slice(0, 5);
}

function optionInfo(opt) {
  if (opt.type === 'evolution') return { icon: opt.ev.icon, name: opt.ev.name, desc: opt.ev.desc, evo: true };
  if (opt.type === 'newWeapon') return { icon: WEAPON_DEFS[opt.id].icon, name: WEAPON_DEFS[opt.id].name, desc: WEAPON_DEFS[opt.id].desc };
  if (opt.type === 'weaponUp') return { icon: WEAPON_DEFS[opt.id].icon, name: WEAPON_DEFS[opt.id].name + ' 强化', desc: '伤害/效果提升' };
  if (opt.type === 'newPassive' || opt.type === 'passiveUp') return { icon: PASSIVE_DEFS[opt.id].icon, name: PASSIVE_DEFS[opt.id].name, desc: PASSIVE_DEFS[opt.id].desc };
  return { icon: '🍗', name: '烤鸡腿', desc: '回复 35% 生命' };
}

function applyOption(opt) {
  if (opt.type === 'evolution') {
    const w = player.weapons[opt.ev.weapon];
    w.evolved = true;
    LOG.info('超武进化：' + opt.ev.name);
    AudioSys.play('evolve');
    addDmgText(player.x, player.y - 60, '超武觉醒！' + opt.ev.name, '#ffd77a', 26);
    game.flashT = 0.6; shake(12, 0.5);
  } else if (opt.type === 'newWeapon') giveWeapon(opt.id);
  else if (opt.type === 'weaponUp') player.weapons[opt.id].level++;
  else if (opt.type === 'newPassive') { player.passives[opt.id] = 1; recomputeStats(); }
  else if (opt.type === 'passiveUp') { player.passives[opt.id] = (player.passives[opt.id] || 0) + 1; recomputeStats(); }
  else if (opt.type === 'heal') player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.35);
}

function openLevelUp() {
  game.state = 'levelup';
  joyReset(); // 界面切换重置摇杆，防止触摸状态残留
  AudioSys.play('levelup');
  addParticles(player.x, player.y - 20, '#ffe9a8', 26, 260); // 升级金光粒子爆发
  const cards = document.getElementById('levelupCards');
  cards.innerHTML = '';
  const opts = generateOptions();
  opts.forEach((opt, i) => {
    const info = optionInfo(opt);
    const div = document.createElement('div');
    div.className = 'card' + (info.evo ? ' evo' : '');
    div.innerHTML = `<div class="icon">${info.icon}</div><div class="name">${info.name}</div>` +
      `<div class="desc">${info.desc}</div><div class="tag">${opt.tag}　[${i + 1}]</div>`;
    div.addEventListener('click', () => {
      applyOption(opt);
      game.pendingLevels = Math.max(0, game.pendingLevels - 1); // 消化一级连升
      joyReset(); // 关键修复：选完技能强制重置摇杆，解决"摇杆点不出来"
      if (game.pendingLevels > 0) {
        openLevelUp(); // 还有连升：继续弹下一轮5选1
      } else {
        document.getElementById('levelup').classList.add('hidden');
        game.state = 'playing';
      }
    });
    cards.appendChild(div);
  });
  document.getElementById('levelup').classList.remove('hidden');
}

// ============================== 掉落物处理 ==============================
function updateDrops(dt) {
  // 经验宝石：磁吸向玩家
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.x += g.vx * dt; g.y += g.vy * dt; g.vx *= 0.92; g.vy *= 0.92;
    const d2 = dist2(g, player);
    if (d2 < player.pickup * player.pickup) { // 磁吸范围
      const d = Math.sqrt(d2) || 1;
      const pull = clamp(420 / d, 3, 14);
      g.x += (player.x - g.x) / d * pull; g.y += (player.y - g.y) / d * pull;
    }
    if (d2 < 30 * 30) { gems.splice(i, 1); addXp(g.value); }
  }
  // 掉落物：走近触碰拾取
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.t += dt;
    const dd2 = dist2(d, player);
    if (d.type === 'coin' && dd2 < player.pickup * player.pickup * 1.4) {
      const dd = Math.sqrt(dd2) || 1;
      d.x += (player.x - d.x) / dd * 6; d.y += (player.y - d.y) / dd * 6;
    }
    if (dd2 < 34 * 34) {
      drops.splice(i, 1);
      if (d.type === 'chicken') { player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3); addDmgText(player.x, player.y - 40, '+回血', '#7dff8a', 18); }
      else if (d.type === 'magnet') { for (const g of gems) { g.x = player.x; g.y = player.y; } addDmgText(player.x, player.y - 40, '全屏吸取！', '#7de6ff', 18); }
      else if (d.type === 'bomb') {
        shake(16, 0.6); game.flashT = 0.5;
        AudioSys.play('bomb');
        addParticles(player.x, player.y, '#ffd77a', 40, 380);
        for (const e of enemies) if (!e.dead && e.type !== 'boss') damageEnemy(e, 9999);
        addDmgText(player.x, player.y - 40, '清屏炸弹！', '#ffd77a', 22);
      }
      else if (d.type === 'chest') { addDmgText(player.x, player.y - 40, '宝箱：直接升级！', '#ffd77a', 20); AudioSys.play('chest'); game.pendingLevels++; if (game.state === 'playing') openLevelUp(); }
      else if (d.type === 'coin') { game.coins += 1; game.coinPulse = 1; addParticles(d.x, d.y, '#ffd77a', 4, 120); AudioSys.play('coin'); } // 金币拾取闪光+音
    }
  }
}

// ============================== 敌人AI ==============================
function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    // 减速计时
    const slow = e.slowT > 0 ? 0.55 : 1;
    e.slowT -= dt;
    e.flash -= dt;
    for (const k in e.hitT) e.hitT[k] -= dt;

    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;

    if (e.type === 'gold') {
      // 金怪：逃跑
      e.x -= dx / d * e.speed * dt; e.y -= dy / d * e.speed * dt;
    } else if (e.type === 'ranged') {
      // 远程怪：保持距离丢弹幕
      const want = 230;
      if (d > want + 30) { e.x += dx / d * e.speed * dt * slow; e.y += dy / d * e.speed * dt * slow; }
      else if (d < want - 30) { e.x -= dx / d * e.speed * dt * slow; e.y -= dy / d * e.speed * dt * slow; }
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        e.shootCd = 2.4;
        eBullets.push({ x: e.x, y: e.y - 12, vx: dx / d * 230, vy: dy / d * 230, dmg: e.dmg, r: 7, life: 3.2 });
      }
    } else {
      // 走地怪/精英/Boss：追击
      e.x += dx / d * e.speed * dt * slow; e.y += dy / d * e.speed * dt * slow;
      if (e.type === 'boss') { // Boss环形弹幕
        e.burstCd -= dt;
        if (e.burstCd <= 0) {
          e.burstCd = 3.2;
          for (let i = 0; i < 14; i++) {
            const a = i * Math.PI * 2 / 14;
            eBullets.push({ x: e.x, y: e.y - 30, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, dmg: e.dmg * 0.7, r: 9, life: 4 });
          }
          shake(6, 0.25);
        }
      }
    }

    // 接触伤害（玩家有无敌帧）
    const er = e.r + player.r;
    if (d < er) {
      damagePlayer(e.dmg);
      // 轻推挤开，防止怪贴脸糊死
      e.x -= dx / d * 12; e.y -= dy / d * 12;
    }
  }
  // 清理死亡怪物（延迟到帧末，保证遍历安全）
  if (enemies.length && enemies.some(e => e.dead)) enemies = enemies.filter(e => !e.dead);
}

// ============================== 玩家移动 ==============================
function updatePlayer(dt) {
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (joy.active) { mx += joy.dx / 60; my += joy.dy / 60; }
  const m = Math.hypot(mx, my);
  if (m > 0.01) {
    mx /= m; my /= m;
    player.x += mx * player.speed * dt;
    player.y += my * player.speed * dt;
    if (mx !== 0) player.facing = mx > 0 ? 1 : -1;
    player.walkT += dt * 10;
  } else {
    player.walkT *= 0.9;
  }
  player.iframe -= dt;
}

// ============================== 游戏流程 ==============================
function startGame() {
  // 重置全部状态
  game.state = 'playing'; game.time = 0; game.kills = 0; game.damage = 0;
  game.level = 1; game.xp = 0; game.xpNeed = CONFIG.xpNeed(1);
  game.endless = false; game.bossSpawned = false; game.boss = null;
  game.shakeT = 0; game.flashT = 0;
  game.combo = 0; game.comboT = 0; game.comboScale = 0; game.coinPulse = 0;
  game.pendingLevels = 0; joyReset();
  AudioSys.init(); AudioSys.startBgm(); // 用户手势内初始化音频（浏览器自动播放策略）
  enemies = []; bullets = []; eBullets = []; gems = []; drops = []; particles = []; dmgTexts = [];
  minions = []; zaps = []; fireZones = [];
  player.x = 0; player.y = 0; player.hp = CONFIG.playerHp; player.maxHp = CONFIG.playerHp;
  player.weapons = {}; player.passives = {};
  giveWeapon('arrow'); // 初始武器：暗影箭
  recomputeStats();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('settle').classList.add('hidden');
  document.getElementById('pauseBtn').classList.remove('hidden');
  spawnBudget = 0; specialCd = { elite: 30, gold: 45 };
  LOG.info('开局：新一局开始');
}

function endRun(victoryFlag, endlessQuit) {
  // 更新纪录
  save.records.time = Math.max(save.records.time, Math.floor(game.time));
  save.records.kills = Math.max(save.records.kills, game.kills);
  save.records.damage = Math.max(save.records.damage, Math.floor(game.damage));
  writeSave();
  game.state = 'settle';
  document.getElementById('settleTitle').textContent =
    endlessQuit ? '无尽结算' : (victoryFlag ? '通 关 ！' : '游 戏 结 束');
  document.getElementById('settleStats').innerHTML =
    `存活 <b>${fmtTime(game.time)}</b>　击杀 <b>${game.kills}</b>　总伤害 <b>${Math.floor(game.damage).toLocaleString()}</b><br>` +
    `等级 <b>${game.level}</b>　金币 <b>${game.coins}</b>`;
  // 无尽继续按钮：仅通关时提供
  document.getElementById('endlessBtn').style.display = (victoryFlag && !endlessQuit) ? '' : 'none';
  document.getElementById('settle').classList.remove('hidden');
  document.getElementById('pauseBtn').classList.add('hidden');
}

function victory() {
  if (game.endless) return; // 无尽模式下击杀Boss不结束
  game.flashT = 0.6;
  LOG.info('通关！击杀Boss，存活 ' + fmtTime(game.time) + '，击杀 ' + game.kills);
  endRun(true, false);
}
function gameOver() {
  LOG.info('死亡结算：存活 ' + fmtTime(game.time) + '，击杀 ' + game.kills + '，等级 ' + game.level);
  endRun(false, false);
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// ============================== 渲染 ==============================
function render() {
  // 震屏偏移
  let sx = 0, sy = 0;
  if (game.shakeT > 0) { sx = rand(-1, 1) * game.shakeMag; sy = rand(-1, 1) * game.shakeMag; }

  // ---- 地面（2.5D等距网格滚动）----
  const camX = player.x - W / 2 - sx, camY = player.y - H / 2 - sy;
  ctx.fillStyle = '#241640'; ctx.fillRect(0, 0, W, H);
  const tw = 128, th = 64;
  const ox = -((camX % tw) + tw) % tw, oy = -((camY % th) + th) % th;
  for (let gx = ox - tw; gx < W + tw; gx += tw) {
    for (let gy = oy - th; gy < H + th; gy += th) ctx.drawImage(groundTile, gx, gy);
  }

  // 世界坐标 → 屏幕坐标
  const wx = x => x - camX, wy = y => y - camY;

  // ---- 毒圈（地面效果，画在实体下方）----
  for (const id in player.weapons) {
    const w = player.weapons[id];
    if (id === 'poison' && w.poisonR) {
      const r = w.poisonR;
      ctx.fillStyle = w.evolved ? 'rgba(120,255,90,0.20)' : 'rgba(120,220,90,0.13)';
      ctx.beginPath(); ctx.ellipse(wx(player.x), wy(player.y), r, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(150,255,120,0.35)'; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  // ---- 圣火区域（地面效果，画在实体下方）----
  for (const z of fireZones) {
    const x = wx(z.x), y = wy(z.y);
    const flicker = 0.85 + Math.sin(z.life * 8) * 0.15; // 火焰闪烁
    const g = ctx.createRadialGradient(x, y, 0, x, y, z.r);
    g.addColorStop(0, 'rgba(255,170,60,0.5)');
    g.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x, y, z.r * flicker, z.r * 0.7 * flicker, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,90,0.45)'; ctx.lineWidth = 2; ctx.stroke();
  }

  // ---- 掉落物 & 宝石 ----
  for (const g of gems) {
    const x = wx(g.x), y = wy(g.y);
    ctx.fillStyle = g.big ? '#7de6ff' : '#5cc8ff';
    ctx.beginPath();
    ctx.moveTo(x, y - (g.big ? 11 : 7)); ctx.lineTo(x + (g.big ? 7 : 5), y);
    ctx.lineTo(x, y + (g.big ? 11 : 7)); ctx.lineTo(x - (g.big ? 7 : 5), y); ctx.closePath(); ctx.fill();
  }
  for (const d of drops) {
    const x = wx(d.x), y = wy(d.y) + Math.sin(d.t * 3) * 3;
    const icons = { chicken: '🍗', magnet: '🧲', bomb: '💣', chest: '🎁', coin: '🪙' };
    ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(icons[d.type] || '?', x, y - 12);
  }

  // ---- 实体按Y排序（2.5D前后遮挡）----
  const drawables = enemies.map(e => ({ y: e.y, e }));
  drawables.push({ y: player.y, p: true });
  drawables.sort((a, b) => a.y - b.y);
  for (const d of drawables) {
    if (d.p) {
      // 玩家：走路弹跳 + 受击闪白/无敌闪烁
      const bob = Math.abs(Math.sin(player.walkT)) * 3;
      if (player.iframe > 0 && Math.floor(player.iframe * 12) % 2 === 0) ctx.globalAlpha = 0.55;
      drawSprite(wx(player.x), wy(player.y) - bob, 1.15, '#3f6fe8', '#ffd9b0', { facing: player.facing });
      ctx.globalAlpha = 1;
    } else {
      const e = d.e;
      if (e.flash > 0) ctx.globalAlpha = 0.75;
      drawSprite(wx(e.x), wy(e.y), e.scale, e.body, e.head, { facing: 1, horns: e.horns, hornColor: '#ffe9c9' });
      ctx.globalAlpha = 1;
      // 精英/Boss 血条
      if (e.type === 'elite' || e.type === 'boss') {
        const bw = e.type === 'boss' ? 120 : 48, bx = wx(e.x) - bw / 2, by = wy(e.y) - e.r * 2.6 - 26;
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(bx, by, bw, 7, 3); ctx.fill();
        ctx.fillStyle = e.type === 'boss' ? '#ff4d5e' : '#ff9d47';
        roundRect(bx, by, bw * clamp(e.hp / e.maxHp, 0, 1), 7, 3); ctx.fill();
      }
    }
  }

  // ---- 子弹 ----
  for (const b of bullets) {
    const x = wx(b.x), y = wy(b.y);
    if (b.type === 'arrow') {
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.fillStyle = '#c9a7ff';
      roundRect(-10, -3, 20, 6, 3); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(6, -2, 6, 4);
      ctx.restore();
    } else if (b.type === 'sword') {
      // 裁决飞剑：金色长剑形弹体
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(0, -5); ctx.lineTo(-14, 0); ctx.lineTo(0, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(-4, -1.5, 10, 3);
      ctx.restore();
    }
  }
  // 召唤小骷髅（Q版小圆头）
  for (const m of minions) {
    const x = wx(m.x), y = wy(m.y);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8e0ff';
    ctx.beginPath(); ctx.arc(x, y - 10, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2a5a';
    ctx.beginPath(); ctx.arc(x - 3, y - 12, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 3, y - 12, 2, 0, Math.PI * 2); ctx.fill();
  }
  // 神圣闪电链特效（折线抖动模拟闪电）
  for (const z of zaps) {
    const x1 = wx(z.x1), y1 = wy(z.y1), x2 = wx(z.x2), y2 = wy(z.y2);
    const alpha = clamp(z.life * 5, 0, 1);
    ctx.strokeStyle = `rgba(180,220,255,${alpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo((x1 + x2) / 2 + rand(-14, 14), (y1 + y2) / 2 + rand(-14, 14)); // 中段抖动
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.stroke();
  }
  // 环绕血镰
  for (const id in player.weapons) {
    const w = player.weapons[id];
    if (id === 'scythe') {
      let n = 1 + Math.floor(w.level / 2) + (w.evolved ? 2 : 0);
      const orbitR = (72 + w.level * 4) * player.areaMult * (w.evolved ? 1.35 : 1);
      for (let i = 0; i < n; i++) {
        const a = w.t * 2.4 + i * Math.PI * 2 / n;
        const x = wx(player.x + Math.cos(a) * orbitR), y = wy(player.y + Math.sin(a) * orbitR * 0.7);
        ctx.save(); ctx.translate(x, y); ctx.rotate(a * 3);
        ctx.fillStyle = w.evolved ? '#ff5c7a' : '#b06cff';
        roundRect(-5, -16, 10, 32, 5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-2, -14, 3, 26);
        ctx.restore();
      }
    }
    // 回旋锤
    if (id === 'hammer' && w.hammerOut) {
      const x = wx(w.hx), y = wy(w.hy);
      ctx.save(); ctx.translate(x, y); ctx.rotate(w.ht * 12);
      ctx.fillStyle = w.evolved ? '#ffd77a' : '#c9b8e8';
      roundRect(-13, -13, 26, 26, 7); ctx.fill();
      ctx.fillStyle = '#7a5b2e'; ctx.fillRect(-3, -20, 6, 14);
      ctx.restore();
    }
  }
  // 敌方弹幕
  for (const b of eBullets) {
    const x = wx(b.x), y = wy(b.y);
    ctx.fillStyle = '#ff7d92';
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(x - b.r * 0.3, y - b.r * 0.3, b.r * 0.35, 0, Math.PI * 2); ctx.fill();
  }

  // ---- 粒子 & 伤害飘字 ----
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(wx(p.x), wy(p.y), p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of dmgTexts) {
    ctx.globalAlpha = clamp(t.life * 1.6, 0, 1);
    ctx.font = `bold ${t.size}px "Microsoft YaHei",sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(t.text, wx(t.x), wy(t.y));
    ctx.fillStyle = t.color; ctx.fillText(t.text, wx(t.x), wy(t.y));
  }
  ctx.globalAlpha = 1;

  // ---- 受击红闪 / Boss警告红屏 ----
  if (game.flashT > 0) {
    ctx.fillStyle = `rgba(255,40,60,${clamp(game.flashT * 0.35, 0, 0.35)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- HUD ----
  renderHud();

  // ---- 虚拟摇杆 ----
  if (joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(joy.baseX + joy.dx, joy.baseY + joy.dy, 26, 0, Math.PI * 2); ctx.fill();
  }
}

// HUD：血条/经验条/计时/击杀/金币/武器栏
function renderHud() {
  const pad = 14, barW = Math.min(320, W * 0.42);
  // 经验条（顶部通栏）
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, 12);
  ctx.fillStyle = '#5cc8ff'; ctx.fillRect(0, 0, W * clamp(game.xp / game.xpNeed, 0, 1), 12);
  // 血条
  const hx = pad, hy = 22;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(hx, hy, barW, 18, 9); ctx.fill();
  ctx.fillStyle = player.hp / player.maxHp > 0.3 ? '#5ee06a' : '#ff5566';
  roundRect(hx, hy, barW * clamp(player.hp / player.maxHp, 0, 1), 18, 9); ctx.fill();
  ctx.font = 'bold 12px "Microsoft YaHei",sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}　Lv.${game.level}`, hx + 10, hy + 10);
  // 计时/击杀/金币（右上）
  ctx.textAlign = 'right';
  ctx.font = 'bold 20px "Microsoft YaHei",sans-serif'; ctx.fillStyle = '#ffe9a8';
  ctx.fillText(fmtTime(game.time), W - 70, 32);
  ctx.font = 'bold 13px "Microsoft YaHei",sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(`击杀 ${game.kills}　金币 ${game.coins}`, W - 70, 56);
  if (game.bossSpawned && game.boss && game.boss.hp > 0) {
    ctx.fillStyle = '#ff5566'; ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
    ctx.fillText('⚠ BOSS', W - 70, 80);
  }
  // 连杀跳字（屏幕上方居中，连杀越高颜色越炸）
  if (game.combo >= 3) {
    const s = 1 + game.comboScale * 0.5;
    ctx.save();
    ctx.translate(W / 2, 66); ctx.scale(s, s);
    ctx.font = 'bold 30px "Microsoft YaHei",sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(game.combo + ' 连杀!', 0, 0);
    ctx.fillStyle = game.combo >= 30 ? '#ff5566' : (game.combo >= 15 ? '#ffd77a' : '#fff');
    ctx.fillText(game.combo + ' 连杀!', 0, 0);
    ctx.restore();
  }
  // 金币拾取浮字（+1 向上飘散淡出）
  if (game.coinPulse > 0) {
    ctx.save();
    ctx.globalAlpha = game.coinPulse;
    ctx.font = 'bold ' + (13 + game.coinPulse * 6) + 'px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffe98a'; ctx.textAlign = 'right';
    ctx.fillText('+1', W - 70, 74 - (1 - game.coinPulse) * 22);
    ctx.restore();
  }
  // 武器/被动栏（左下，窄屏整体缩放防溢出：8武器+8被动全开约700px宽）
  const stripScale = Math.min(1, (W - 28) / 720);
  ctx.save();
  ctx.translate(pad, H - 46); ctx.scale(stripScale, stripScale);
  let ix = 0, iy = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const id in player.weapons) {
    const w = player.weapons[id];
    ctx.fillStyle = w.evolved ? 'rgba(120,90,10,0.85)' : 'rgba(40,25,80,0.85)';
    roundRect(ix, iy, 38, 38, 9); ctx.fill();
    ctx.font = '20px serif'; ctx.fillStyle = '#fff';
    ctx.fillText(WEAPON_DEFS[id].icon, ix + 19, iy + 17);
    ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = w.evolved ? '#ffd77a' : '#cbbdf0';
    ctx.fillText(w.evolved ? 'MAX' : 'Lv' + w.level, ix + 19, iy + 31);
    ix += 44;
  }
  for (const id in player.passives) {
    ctx.fillStyle = 'rgba(25,55,45,0.8)';
    roundRect(ix, iy, 32, 38, 9); ctx.fill();
    ctx.font = '15px serif'; ctx.fillStyle = '#fff';
    ctx.fillText(PASSIVE_DEFS[id].icon, ix + 16, iy + 15);
    ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#9fe8c8';
    ctx.fillText('Lv' + player.passives[id], ix + 16, iy + 30);
    ix += 38;
  }
  ctx.restore();
}

// ============================== 主循环 ==============================
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05); // 钳制dt，防止切后台回来爆炸
  lastT = now;

  if (game.state === 'playing') {
    game.time += dt;
    // 连杀计时衰减（2.5秒没击杀就断连）+ 动画缓动
    if (game.comboT > 0) { game.comboT -= dt; if (game.comboT <= 0) game.combo = 0; }
    game.comboScale += (0 - game.comboScale) * Math.min(1, dt * 6);
    game.coinPulse = Math.max(0, game.coinPulse - dt * 1.6);
    updatePlayer(dt);
    updateSpawner(dt);
    updateWeapons(dt);
    updateSummons(dt); // 召唤物/圣火/闪电特效更新
    updateEnemies(dt);
    updateDrops(dt);
    // 子弹飞行
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let hit = false;
      if (!b.hitSet) b.hitSet = new Set(); // 穿透去重：记录已命中的怪，防重复判定伤害
      for (const e of enemies) {
        if (e.dead || b.hitSet.has(e)) continue;
        const er = e.r + b.r;
        if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < er * er) {
          b.hitSet.add(e);
          damageEnemy(e, b.dmg); hit = true;
          if (b.pierce > 0) b.pierce--; else break;
        }
      }
      if (hit && b.pierce <= 0) { bullets.splice(i, 1); continue; }
      if (b.life <= 0) bullets.splice(i, 1);
    }
    // 敌方弹幕
    for (let i = eBullets.length - 1; i >= 0; i--) {
      const b = eBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      const er = b.r + player.r;
      if ((player.x - b.x) ** 2 + (player.y - b.y) ** 2 < er * er) {
        damagePlayer(b.dmg); eBullets.splice(i, 1); continue;
      }
      if (b.life <= 0) eBullets.splice(i, 1);
    }
    // 粒子/飘字
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = dmgTexts.length - 1; i >= 0; i--) {
      const t = dmgTexts[i];
      t.y += t.vy * dt; t.life -= dt;
      if (t.life <= 0) dmgTexts.splice(i, 1);
    }
  }

  // 计时器衰减（震屏/红闪在暂停时也会消散）
  game.shakeT = Math.max(0, game.shakeT - dt);
  game.flashT = Math.max(0, game.flashT - dt);

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============================== UI 事件 ==============================
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', () => {
  // 见好就收：回主菜单并刷新纪录显示；结算面板同按钮也用于"再来一局"
  if (game.state === 'settle') {
    document.getElementById('settle').classList.add('hidden');
    showMenu();
  }
});
document.getElementById('endlessBtn').addEventListener('click', () => {
  // 无尽继续：回到战斗，难度继续加压
  game.endless = true;
  game.state = 'playing';
  document.getElementById('settle').classList.add('hidden');
  document.getElementById('pauseBtn').classList.remove('hidden');
  if (game.boss) game.boss.dead = true; // Boss退场
});
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('quitBtn').addEventListener('click', () => {
  // 回主菜单：放弃本局（不计入纪录）
  document.getElementById('pausePanel').classList.add('hidden');
  LOG.info('中途退出本局');
  showMenu();
});

// 真暂停：状态机冻结游戏循环，弹出暂停面板
function togglePause() {
  const panel = document.getElementById('pausePanel');
  joyReset(); // 界面切换重置摇杆
  if (game.state === 'playing') { game.state = 'paused'; panel.classList.remove('hidden'); }
  else if (game.state === 'paused') { game.state = 'playing'; panel.classList.add('hidden'); }
}

// 升级商店：渲染商品列表，点击购买（金币不足不响应）
function renderShop() {
  document.getElementById('shopCoins').textContent = '金币：' + game.coins + '　（属性下局生效）';
  const box = document.getElementById('shopItems');
  box.innerHTML = '';
  for (const id in META_DEFS) {
    const def = META_DEFS[id], lv = save.meta[id] || 0;
    const cost = metaCost(id, lv);
    const maxed = lv >= def.max;
    const div = document.createElement('div');
    div.className = 'card' + (maxed ? '' : '');
    div.innerHTML = `<div class="icon">${def.icon}</div><div class="name">${def.name}</div>` +
      `<div class="desc">${def.desc}</div>` +
      `<div class="tag">${maxed ? '已满级 ✓' : 'Lv ' + lv + '/' + def.max + '　💰' + cost}</div>`;
    if (!maxed) {
      div.addEventListener('click', () => {
        if (game.coins >= cost) {
          game.coins -= cost;
          save.meta[id] = lv + 1;
          writeSave();      // 立即落盘
          renderShop();     // 刷新价格
          LOG.info('商店购买：' + def.name + ' → Lv' + (lv + 1) + '，剩余金币 ' + game.coins);
        } else {
          LOG.warn('金币不足：' + def.name + ' 需要 ' + cost + '，只有 ' + game.coins);
        }
      });
    }
    box.appendChild(div);
  }
}
document.getElementById('shopBtn').addEventListener('click', () => {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('shop').classList.remove('hidden');
  renderShop();
});
function closeShop() {
  // 关闭商店回主菜单（✕ / 返回按钮 / Esc 三通道共用）
  document.getElementById('shop').classList.add('hidden');
  showMenu();
}
document.getElementById('shopBack').addEventListener('click', closeShop);
document.getElementById('shopClose').addEventListener('click', closeShop);
document.getElementById('audioBtn').addEventListener('click', () => {
  // 静音开关：点击也算用户手势，顺手 init
  AudioSys.init();
  const m = AudioSys.toggleMute();
  document.getElementById('audioBtn').textContent = m ? '🔇' : '🔊';
  LOG.info(m ? '已静音' : '取消静音');
});

function showMenu() {
  game.state = 'menu';
  document.getElementById('menuRecords').innerHTML =
    `金币 <b>${game.coins}</b>　历史最佳：存活 <b>${fmtTime(save.records.time)}</b>　击杀 <b>${save.records.kills}</b>　伤害 <b>${save.records.damage.toLocaleString()}</b>`;
  document.getElementById('shop').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('pauseBtn').classList.add('hidden');
}
showMenu();
document.getElementById('audioBtn').textContent = save.settings.muted ? '🔇' : '🔊'; // 同步静音记忆
AudioSys.muted = save.settings.muted; // 启动即同步静音状态
// 音频解锁保险：任何首次触摸/点击都尝试 init（部分手机 webview 对手势解锁挑剔）
document.addEventListener('touchstart', () => AudioSys.init(), { once: true, passive: true });
document.addEventListener('click', () => AudioSys.init(), { once: true });

// 切后台自动暂停（用状态冻结实现）
document.addEventListener('visibilitychange', () => {
  // 切后台自动暂停并显示面板；回前台保持暂停，玩家手动继续（防误触暴毙）
  if (document.hidden && game.state === 'playing') {
    game.state = 'paused';
    document.getElementById('pausePanel').classList.remove('hidden');
